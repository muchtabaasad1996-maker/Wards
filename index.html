<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ShiftSync">
    <meta name="theme-color" content="#0b0c10">
    
    <title>ShiftSync - Medical Handover</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0c10;
        }
        
        /* Custom scrollbar for textareas and lists */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d313d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #474d61;
        }

        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-leave {
            animation: slideOut 0.3s ease-in forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="text-gray-200 antialiased h-[100dvh] flex flex-col overflow-hidden">

    <!-- Navbar (with iOS safe area padding at the top) -->
    <header class="bg-[#14151b] border-b border-[#22252e] shadow-md z-10 flex-none pt-[env(safe-area-inset-top)]">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 sm:h-16 items-center">
                <div class="flex items-center gap-2 shrink-0">
                    <div class="bg-gradient-to-br from-[#445096] to-[#353e75] text-white p-1.5 sm:p-2 rounded-xl shadow-lg">
                        <i class="fa-solid fa-staff-snake text-base sm:text-xl"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h1 class="font-bold text-sm sm:text-xl text-gray-100 whitespace-nowrap leading-none mb-0.5">ShiftSync Handover</h1>
                        <p class="text-[9px] sm:text-xs text-gray-400 font-medium tracking-wide uppercase whitespace-nowrap leading-none">Clinical Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                    <div id="auth-status" class="hidden sm:flex items-center gap-2 text-sm text-gray-400 bg-[#1a1c23] border border-[#22252e] px-3 py-1.5 rounded-full">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...
                    </div>
                    <button onclick="toggleForm()" class="md:hidden bg-[#445096] hover:bg-[#5260b5] text-white px-2.5 py-1.5 sm:p-2 rounded-xl transition-colors text-xs sm:text-sm font-medium whitespace-nowrap flex items-center gap-1.5 shadow-lg shadow-[#445096]/20">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 gap-6 relative">
        
        <!-- Left Column: Add Patient Form -->
        <aside id="form-container" class="hidden md:flex w-full md:w-1/3 flex-col bg-[#14151b] border border-[#22252e] md:rounded-2xl shadow-xl overflow-hidden fixed md:relative z-50 md:z-0 inset-0 md:inset-auto md:h-full pb-[env(safe-area-inset-bottom)]">
            <div class="p-4 border-b border-[#22252e] bg-[#1a1c23] flex justify-between items-center">
                <h2 class="font-semibold text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-[#a37d57]"></i> New Admission
                </h2>
                <button onclick="toggleForm()" class="md:hidden text-gray-500 hover:text-gray-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 pb-24 md:pb-4 custom-scrollbar">
                <form id="patient-form" class="space-y-4">
                    <!-- Basics -->
                    <div class="space-y-3 bg-[#1a1c23] p-4 rounded-2xl border border-[#22252e]">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Patient Name *</label>
                            <input type="text" id="p-name" required class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all" placeholder="John Doe">
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Age *</label>
                                <input type="number" id="p-age" required min="0" max="150" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all" placeholder="e.g. 45">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Gender *</label>
                                <select id="p-gender" required class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all">
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Ward / Dept *</label>
                            <select id="p-ward" required class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all">
                                <option value="" disabled selected>Select Department</option>
                                <option value="ER">Emergency Room (ER)</option>
                                <option value="ICU">Intensive Care Unit (ICU)</option>
                                <option value="Internal Medicine">Internal Medicine</option>
                                <option value="Surgery">Surgery</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="OB/GYN">OB/GYN</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Primary Physician</label>
                                <input type="text" id="p-physician" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all" placeholder="Dr. Name">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-red-400/80 uppercase tracking-wider mb-1">Allergies</label>
                                <input type="text" id="p-allergies" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-red-900/30 text-gray-100 rounded-xl focus:ring-2 focus:ring-red-500/50 outline-none transition-all" placeholder="e.g. Penicillin">
                                <div class="flex flex-wrap gap-1.5 mt-1.5">
                                    <button type="button" onclick="addSuggestion('p-allergies', 'NKDA')" class="text-[9px] font-medium bg-[#22252e] text-gray-300 px-2 py-0.5 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">NKDA</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Clinical Details -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Chief Complaint *</label>
                            <input type="text" id="p-cc" required class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all" placeholder="e.g., Chest pain for 2 hours">
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-cc', 'Chest pain')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Chest pain</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'SOB')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">SOB</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Abdominal pain')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Abd pain</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Fever')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Fever</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Headache')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Headache</button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Past Medical History (PMH)</label>
                            <textarea id="p-pmh" rows="2" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Chronic illnesses, DM, HTN..."></textarea>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-pmh', 'None')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">None</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'DM')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">DM</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'HTN')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">HTN</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'IHD')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">IHD</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'Asthma')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Asthma</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'CKD')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">CKD</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'Thyroid')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Thyroid</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'Migraines')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Migraines</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Past Surgical History (PSH)</label>
                            <textarea id="p-psh" rows="2" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Previous surgeries, dates..."></textarea>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-psh', 'None')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">None</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'Appendectomy')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Appendectomy</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'Cholecystectomy')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Cholecystectomy</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'C-Section')" class="text-[10px] font-medium bg-[#22252e] text-gray-300 px-2.5 py-1 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">C-Section</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Current Medications</label>
                            <textarea id="p-meds" rows="2" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Medication, Dose, Frequency..."></textarea>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Family History</label>
                                <textarea id="p-family" rows="2" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Heart Disease, Cancer..."></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Social History</label>
                                <textarea id="p-social" rows="2" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Smoking, Alcohol..."></textarea>
                                <div class="flex flex-wrap gap-1.5 mt-1.5">
                                    <button type="button" onclick="addSuggestion('p-social', 'Smoker')" class="text-[9px] font-medium bg-[#22252e] text-gray-300 px-2 py-0.5 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Smoker</button>
                                    <button type="button" onclick="addSuggestion('p-social', 'Alcohol')" class="text-[9px] font-medium bg-[#22252e] text-gray-300 px-2 py-0.5 rounded-full hover:bg-[#2d313d] transition-colors border border-[#2d313d]">Alcohol</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Clinical Examination (O/E)</label>
                            <textarea id="p-exam" rows="3" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Vitals, systemic examination findings..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Management Plan & Notes *</label>
                            <textarea id="p-plan" required rows="3" class="w-full text-sm p-2.5 bg-[#0b0c10] border border-[#22252e] text-gray-100 rounded-xl focus:ring-2 focus:ring-[#445096] focus:border-[#445096] outline-none transition-all resize-none" placeholder="Labs requested, imaging, current meds, next steps..."></textarea>
                        </div>
                    </div>
                    
                    <div class="pt-4 pb-8 md:pb-2">
                        <button type="button" onclick="submitPatient()" id="submit-btn" class="w-full bg-gradient-to-r from-[#c09263] to-[#996d42] hover:from-[#cda377] hover:to-[#a87a4d] text-white font-semibold py-3 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(192,146,99,0.39)] transition-all flex items-center justify-center gap-2 text-base">
                            <i class="fa-solid fa-floppy-disk"></i> Save & Handover
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- Right Column: Patient List / Dashboard -->
        <section class="flex-1 flex flex-col bg-[#14151b] border border-[#22252e] rounded-2xl shadow-xl overflow-hidden h-full">
            <div class="p-4 border-b border-[#22252e] bg-[#1a1c23] flex justify-between items-center shrink-0">
                <h2 class="font-semibold text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-list text-[#445096]"></i> Active Patients
                </h2>
                <div class="flex items-center gap-2">
                    <div class="text-xs font-medium text-gray-300 bg-[#0b0c10] border border-[#22252e] px-3 py-1.5 rounded-full shadow-sm" id="patient-count">
                        0 Patients
                    </div>
                    <button onclick="exportToWord()" title="Export to Word Document" class="text-gray-400 hover:text-gray-100 bg-[#0b0c10] border border-[#22252e] px-2.5 py-1.5 rounded-lg shadow-sm transition-colors text-sm">
                        <i class="fa-solid fa-file-word"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar bg-[#0b0c10]/50" id="patients-container">
                <!-- Loading State -->
                <div id="loading-state" class="h-full flex flex-col items-center justify-center text-gray-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-[#c09263]"></i>
                    <p class="text-sm">Loading handover data...</p>
                </div>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-gray-500">
                    <div class="bg-[#1a1c23] p-4 rounded-full shadow-lg border border-[#22252e] mb-4">
                        <i class="fa-solid fa-clipboard-check text-4xl text-[#c09263]"></i>
                    </div>
                    <h3 class="text-lg font-medium text-gray-300 mb-1">Ward is Empty</h3>
                    <p class="text-sm">No active patients. Add a patient to start the handover.</p>
                </div>

                <!-- Cards Grid -->
                <div id="cards-grid" class="hidden grid grid-cols-1 xl:grid-cols-2 gap-4 pb-4">
                    <!-- Cards injected here via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Firebase Configuration and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables Environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'medsync-handover-default';
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        let firebaseConfig;
        
        try {
            firebaseConfig = JSON.parse(rawConfig);
            // --- YOUR FIREBASE CONFIG GOES HERE ---
            // If you host this externally, replace this block with your Firebase config
            // to enable real-time syncing between devices!
            if(Object.keys(firebaseConfig).length === 0) {
                firebaseConfig = {
                    apiKey: "mock-key",
                    projectId: "mock-project",
                };
            }
        } catch (e) {
            console.error("Config parse error", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isLocalMode = false;
        let patientsList = [];
        let unsubscribeSnapshot = null;

        // UI Elements
        const authStatusEl = document.getElementById('auth-status');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        const cardsGrid = document.getElementById('cards-grid');
        const patientCountEl = document.getElementById('patient-count');
        const submitBtn = document.getElementById('submit-btn');
        const formContainer = document.getElementById('form-container');

        // Color mapping for wards
        const wardColors = {
            'ER': 'bg-red-500/10 text-red-400 border-red-500/20',
            'ICU': 'bg-orange-500/10 text-orange-400 border-orange-500/20',
            'Internal Medicine': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
            'Surgery': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Pediatrics': 'bg-purple-500/10 text-purple-400 border-purple-500/20',
            'OB/GYN': 'bg-pink-500/10 text-pink-400 border-pink-500/20',
            'Other': 'bg-gray-500/10 text-gray-400 border-gray-500/20'
        };

        // Auth Initialization
        async function initAuth() {
            try {
                if (firebaseConfig.apiKey === "mock-key") {
                    throw new Error("Missing real Firebase config. Using local fallback.");
                }
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.warn("Authentication bypassed. Switching to Local Mode:", error);
                isLocalMode = true;
                currentUser = { uid: 'local-user' }; // Fake user for local mode
                authStatusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-500"></i> Local Mode (No Sync)`;
                showToast("Running locally. Add Firebase config to sync between devices.", "warning");
                loadPatients(); // Trigger local load
            }
        }

        // Listen to Auth State
        onAuthStateChanged(auth, (user) => {
            if (isLocalMode) return; // Skip if we already fell back to local mode
            if (user) {
                currentUser = user;
                authStatusEl.innerHTML = `<i class="fa-solid fa-user-doctor text-[#c09263]"></i> Ready (ID: ${user.uid.substring(0, 5)}...)`;
                loadPatients();
            } else {
                currentUser = null;
                authStatusEl.innerHTML = `<i class="fa-solid fa-link-slash text-red-500"></i> Disconnected`;
                if(unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        // Initialize App
        initAuth();

        // Data Fetching and Listener
        function loadPatients() {
            if (!currentUser) return;

            if (isLocalMode) {
                const stored = localStorage.getItem('shiftSyncPatients');
                patientsList = stored ? JSON.parse(stored) : [];
                patientsList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPatients();
                return;
            }

            // RULE 1: Strict Paths enforced here (Public Shared Data)
            const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');

            // RULE 2: No Complex Queries. Fetch all, process locally.
            unsubscribeSnapshot = onSnapshot(patientsRef, (snapshot) => {
                patientsList = [];
                snapshot.forEach((doc) => {
                    patientsList.push({ id: doc.id, ...doc.data() });
                });

                // Local Sort: Newest first
                patientsList.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeB - timeA;
                });

                renderPatients();
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                showToast("Failed to sync patients.", "error");
            });
        }

        // Render Cards UI
        function renderPatients() {
            loadingState.classList.add('hidden');
            
            patientCountEl.textContent = `${patientsList.length} Patient${patientsList.length !== 1 ? 's' : ''}`;

            if (patientsList.length === 0) {
                emptyState.classList.remove('hidden');
                cardsGrid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                
                cardsGrid.innerHTML = '';
                
                patientsList.forEach(patient => {
                    const wardClass = wardColors[patient.ward] || wardColors['Other'];
                    const genderIcon = patient.gender === 'Male' ? '<i class="fa-solid fa-mars text-blue-400"></i>' : 
                                     (patient.gender === 'Female' ? '<i class="fa-solid fa-venus text-pink-400"></i>' : '');

                    const allergyBadge = patient.allergies && patient.allergies.toUpperCase() !== 'NKDA' && patient.allergies.toLowerCase() !== 'none'
                        ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-900/40 text-red-400 border border-red-800"><i class="fa-solid fa-triangle-exclamation"></i> Allergy: ${escapeHTML(patient.allergies)}</span>`
                        : (patient.allergies ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#1a1c23] text-gray-400 border border-[#22252e]">Allergies: ${escapeHTML(patient.allergies)}</span>` : '');

                    const card = document.createElement('div');
                    card.className = "bg-[#16171d] border border-[#22252e] rounded-2xl shadow-lg overflow-hidden flex flex-col hover:border-[#383d4f] transition-all duration-200";
                    
                    card.innerHTML = `
                        <div class="p-4 border-b border-[#22252e] flex justify-between items-start gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-bold text-gray-100 text-lg leading-none">${escapeHTML(patient.name)}</h3>
                                    ${genderIcon}
                                </div>
                                <div class="text-sm text-gray-400 font-medium mt-2 flex flex-wrap gap-2 items-center">
                                    <span>${patient.age} y/o</span>
                                    <span>•</span>
                                    <span class="px-2.5 py-1 rounded-md text-xs border font-semibold ${wardClass}">${escapeHTML(patient.ward)}</span>
                                    ${patient.physician ? `<span>• Dr. ${escapeHTML(patient.physician)}</span>` : ''}
                                    ${allergyBadge}
                                </div>
                            </div>
                            <button onclick="window.removePatient('${patient.id}')" title="Discharge / Remove" class="text-gray-500 hover:text-red-400 transition-colors p-1 bg-[#1a1c23] rounded-lg border border-[#22252e]">
                                <i class="fa-solid fa-sign-out-alt text-lg"></i>
                            </button>
                        </div>
                        
                        <div class="p-4 flex-1 space-y-4 text-sm">
                            <div>
                                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-[#c09263]"></i> Chief Complaint</h4>
                                <p class="text-gray-200 font-medium bg-[#1a1c23] p-2.5 rounded-xl border border-[#22252e]">${escapeHTML(patient.cc)}</p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-clock-rotate-left"></i> PMH</h4>
                                    <p class="text-gray-300 line-clamp-3 bg-[#111216] p-2 rounded-lg border border-[#1a1c23] min-h-[42px]">${escapeHTML(patient.pmh) || '<span class="text-gray-600 italic">None</span>'}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-scalpel"></i> PSH</h4>
                                    <p class="text-gray-300 line-clamp-3 bg-[#111216] p-2 rounded-lg border border-[#1a1c23] min-h-[42px]">${escapeHTML(patient.psh) || '<span class="text-gray-600 italic">None</span>'}</p>
                                </div>
                            </div>

                            ${patient.meds || patient.family || patient.social ? `
                            <div class="grid grid-cols-3 gap-3">
                                ${patient.meds ? `<div>
                                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-1"><i class="fa-solid fa-pills"></i> Meds</h4>
                                    <p class="text-gray-400 text-xs bg-[#111216] p-1.5 rounded-lg border border-[#1a1c23]">${escapeHTML(patient.meds)}</p>
                                </div>` : ''}
                                ${patient.family ? `<div>
                                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-1"><i class="fa-solid fa-users"></i> Family Hx</h4>
                                    <p class="text-gray-400 text-xs bg-[#111216] p-1.5 rounded-lg border border-[#1a1c23]">${escapeHTML(patient.family)}</p>
                                </div>` : ''}
                                ${patient.social ? `<div>
                                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-1"><i class="fa-solid fa-martini-glass"></i> Social Hx</h4>
                                    <p class="text-gray-400 text-xs bg-[#111216] p-1.5 rounded-lg border border-[#1a1c23]">${escapeHTML(patient.social)}</p>
                                </div>` : ''}
                            </div>
                            ` : ''}

                            <div>
                                <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-stethoscope"></i> Examination (O/E)</h4>
                                <p class="text-gray-300 bg-[#1a1c23] p-2.5 rounded-xl border border-[#22252e]">${escapeHTML(patient.exam) || '<span class="text-gray-600 italic">No examination details</span>'}</p>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold text-[#6272c7] uppercase tracking-wider mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-clipboard-list"></i> Plan & Notes</h4>
                                <p class="text-gray-100 bg-[#1e2235] p-2.5 rounded-xl border border-[#2d3454] font-medium whitespace-pre-wrap">${escapeHTML(patient.plan)}</p>
                            </div>
                        </div>
                    `;
                    cardsGrid.appendChild(card);
                });
            }
        }

        // Global functions for inline HTML event handlers
        window.submitPatient = async function() {
            if (!currentUser) {
                showToast("Not authenticated.", "error");
                return;
            }

            // Validations
            const name = document.getElementById('p-name').value.trim();
            const age = document.getElementById('p-age').value;
            const gender = document.getElementById('p-gender').value;
            const ward = document.getElementById('p-ward').value;
            const physician = document.getElementById('p-physician').value.trim();
            const allergies = document.getElementById('p-allergies').value.trim();
            const cc = document.getElementById('p-cc').value.trim();
            const pmh = document.getElementById('p-pmh').value.trim();
            const psh = document.getElementById('p-psh').value.trim();
            const meds = document.getElementById('p-meds').value.trim();
            const family = document.getElementById('p-family').value.trim();
            const social = document.getElementById('p-social').value.trim();
            const exam = document.getElementById('p-exam').value.trim();
            const plan = document.getElementById('p-plan').value.trim();

            if (!name || !age || !gender || !ward || !cc || !plan) {
                showToast("Please fill in all required fields (*)", "warning");
                return;
            }

            const patientData = {
                name,
                age: Number(age),
                gender,
                ward,
                physician,
                allergies,
                cc,
                pmh,
                psh,
                meds,
                family,
                social,
                exam,
                plan,
                addedBy: currentUser.uid,
                createdAt: isLocalMode ? Date.now() : serverTimestamp()
            };

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...`;
            submitBtn.disabled = true;

            try {
                if (isLocalMode) {
                    const newPatient = { ...patientData, id: 'local_' + Date.now() };
                    patientsList.push(newPatient);
                    localStorage.setItem('shiftSyncPatients', JSON.stringify(patientsList));
                    loadPatients();
                } else {
                    const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');
                    await addDoc(patientsRef, patientData);
                }
                
                showToast("Patient added to handover list.", "success");
                document.getElementById('patient-form').reset();
                
                // Hide form on mobile after submission
                if(window.innerWidth < 768) {
                    formContainer.classList.add('hidden');
                    formContainer.classList.remove('flex');
                }
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("Failed to add patient.", "error");
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        };

        window.removePatient = async function(docId) {
            if (!currentUser) return;
            
            // Custom confirmation (no alert/confirm allowed per rules)
            // Creating a simple modal inline
            const confirmDelete = confirmModal("Discharge Patient", "Are you sure you want to remove this patient from the active list?", async () => {
                try {
                    if (isLocalMode) {
                        patientsList = patientsList.filter(p => p.id !== docId);
                        localStorage.setItem('shiftSyncPatients', JSON.stringify(patientsList));
                        loadPatients();
                    } else {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'patients', docId);
                        await deleteDoc(docRef);
                    }
                    showToast("Patient removed successfully.", "success");
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    showToast("Failed to remove patient.", "error");
                }
            });
        };

        window.toggleForm = function() {
            if (formContainer.classList.contains('hidden')) {
                formContainer.classList.remove('hidden');
                formContainer.classList.add('flex');
            } else {
                formContainer.classList.add('hidden');
                formContainer.classList.remove('flex');
            }
        };

        window.exportToWord = function() {
            if (patientsList.length === 0) {
                showToast("No patients to export.", "warning");
                return;
            }

            let htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset="utf-8">
                    <title>ShiftSync Handover</title>
                    <style>
                        body { font-family: 'Inter', Arial, sans-serif; }
                        h2 { color: #1e293b; text-align: center; }
                        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
                        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
                        th { background-color: #f1f5f9; color: #334155; font-weight: bold; }
                        td { color: #475569; }
                    </style>
                </head>
                <body>
                    <h2>Clinical Handover - ${new Date().toISOString().split('T')[0]}</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Patient Name</th>
                                <th>Age / Gender</th>
                                <th>Ward / Physician</th>
                                <th>Allergies</th>
                                <th>Chief Complaint</th>
                                <th>Medical/Surgical/Family/Social Hx</th>
                                <th>Current Meds</th>
                                <th>Examination (O/E)</th>
                                <th>Management Plan</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            patientsList.forEach(p => {
                htmlContent += `
                    <tr>
                        <td><strong>${escapeHTML(p.name)}</strong></td>
                        <td>${escapeHTML(p.age)} y/o ${escapeHTML(p.gender)}</td>
                        <td>${escapeHTML(p.ward)}<br>${escapeHTML(p.physician) ? `Dr. ${escapeHTML(p.physician)}` : ''}</td>
                        <td style="color: red;">${escapeHTML(p.allergies) || 'None'}</td>
                        <td>${escapeHTML(p.cc)}</td>
                        <td>
                            <strong>PMH:</strong> ${escapeHTML(p.pmh) || 'None'}<br>
                            <strong>PSH:</strong> ${escapeHTML(p.psh) || 'None'}<br>
                            <strong>Family:</strong> ${escapeHTML(p.family) || 'None'}<br>
                            <strong>Social:</strong> ${escapeHTML(p.social) || 'None'}
                        </td>
                        <td>${escapeHTML(p.meds) || 'None'}</td>
                        <td>${escapeHTML(p.exam) || 'None'}</td>
                        <td>${escapeHTML(p.plan)}</td>
                    </tr>
                `;
            });

            htmlContent += `
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            // Use application/msword and prepend UTF-8 BOM so Arabic/special characters are preserved
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `ShiftSync_Handover_${new Date().toISOString().split('T')[0]}.doc`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("Exported to Word successfully!", "success");
        };

        window.addSuggestion = function(fieldId, text) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            
            // If selecting "None", clear everything else and just put "None"
            if (text === 'None') {
                field.value = 'None';
                field.focus();
                return;
            }

            // Append logic for other suggestions
            let currentValue = field.value.trim();
            if (currentValue === '' || currentValue === 'None') {
                field.value = text;
            } else {
                if (currentValue.endsWith(',')) {
                    field.value = currentValue + ' ' + text;
                } else {
                    field.value = currentValue + ', ' + text;
                }
            }
            field.focus();
        };

        // Utility: Escape HTML to prevent XSS
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = '';
            let colors = '';
            
            if (type === 'success') {
                icon = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                colors = 'bg-[#1a1c23] border-[#22252e] text-gray-200';
            } else if (type === 'error') {
                icon = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
                colors = 'bg-[#1a1c23] border-[#22252e] text-gray-200';
            } else {
                icon = '<i class="fa-solid fa-circle-exclamation text-[#c09263]"></i>';
                colors = 'bg-[#1a1c23] border-[#22252e] text-gray-200';
            }

            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl border shadow-2xl ${colors} min-w-[250px]`;
            toast.innerHTML = `
                ${icon}
                <span class="text-sm font-medium flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-gray-300"><i class="fa-solid fa-xmark"></i></button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if(container.contains(toast)) {
                    toast.classList.replace('toast-enter', 'toast-leave');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // Custom Confirm Modal
        function confirmModal(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-[#0b0c10]/80 z-50 flex items-center justify-center backdrop-blur-sm px-4";
            
            const modal = document.createElement('div');
            modal.className = "bg-[#16171d] border border-[#22252e] rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-[slideIn_0.2s_ease-out]";
            
            modal.innerHTML = `
                <h3 class="text-lg font-bold text-gray-100 mb-2">${title}</h3>
                <p class="text-sm text-gray-400 mb-6">${message}</p>
                <div class="flex justify-end gap-3">
                    <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-gray-300 bg-[#22252e] hover:bg-[#2d313d] rounded-xl transition-colors">Cancel</button>
                    <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-red-500/80 hover:bg-red-500 rounded-xl transition-colors border border-red-600/50">Discharge</button>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            document.getElementById('modal-cancel').onclick = () => {
                document.body.removeChild(overlay);
            };

            document.getElementById('modal-confirm').onclick = () => {
                document.body.removeChild(overlay);
                onConfirm();
            };
        }

    </script>
</body>
</html>
