<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ShiftSync">
    <meta name="theme-color" content="#ffffff">
    
    <title>ShiftSync - Medical Handover</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Custom scrollbar for textareas and lists */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-leave {
            animation: slideOut 0.3s ease-in forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-[100dvh] flex flex-col overflow-hidden">

    <!-- Navbar (with iOS safe area padding at the top) -->
    <header class="bg-white border-b border-slate-200 shadow-sm z-10 flex-none pt-[env(safe-area-inset-top)]">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 sm:h-16 items-center">
                <div class="flex items-center gap-2 shrink-0">
                    <div class="bg-blue-600 text-white p-1.5 sm:p-2 rounded-lg">
                        <i class="fa-solid fa-staff-snake text-base sm:text-xl"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h1 class="font-bold text-sm sm:text-xl text-slate-800 whitespace-nowrap leading-none mb-0.5">ShiftSync Handover</h1>
                        <p class="text-[9px] sm:text-xs text-slate-500 font-medium tracking-wide uppercase whitespace-nowrap leading-none">Clinical Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                    <div id="auth-status" class="hidden sm:flex items-center gap-2 text-sm text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...
                    </div>
                    <button onclick="toggleForm()" class="md:hidden bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 sm:p-2 rounded-lg transition-colors text-xs sm:text-sm font-medium whitespace-nowrap flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 gap-6 relative">
        
        <!-- Left Column: Add Patient Form -->
        <aside id="form-container" class="hidden md:flex w-full md:w-1/3 flex-col bg-white border border-slate-200 md:rounded-xl shadow-sm overflow-hidden fixed md:relative z-50 md:z-0 inset-0 md:inset-auto md:h-full pb-[env(safe-area-inset-bottom)]">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h2 class="font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-blue-600"></i> New Admission
                </h2>
                <button onclick="toggleForm()" class="md:hidden text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 pb-24 md:pb-4 custom-scrollbar">
                <form id="patient-form" class="space-y-4">
                    <!-- Basics -->
                    <div class="space-y-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Patient Name *</label>
                            <input type="text" id="p-name" required class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="John Doe">
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Age *</label>
                                <input type="number" id="p-age" required min="0" max="150" class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="e.g. 45">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Gender *</label>
                                <select id="p-gender" required class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition-all">
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Ward / Dept *</label>
                            <select id="p-ward" required class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition-all">
                                <option value="" disabled selected>Select Department</option>
                                <option value="ER">Emergency Room (ER)</option>
                                <option value="ICU">Intensive Care Unit (ICU)</option>
                                <option value="Internal Medicine">Internal Medicine</option>
                                <option value="Surgery">Surgery</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="OB/GYN">OB/GYN</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Clinical Details -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Chief Complaint *</label>
                            <input type="text" id="p-cc" required class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="e.g., Chest pain for 2 hours">
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-cc', 'Chest pain')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Chest pain</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'SOB')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">SOB</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Abdominal pain')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Abd pain</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Fever')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Fever</button>
                                <button type="button" onclick="addSuggestion('p-cc', 'Headache')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Headache</button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Past Medical History (PMH)</label>
                            <textarea id="p-pmh" rows="2" class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none" placeholder="Chronic illnesses, DM, HTN..."></textarea>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-pmh', 'None')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">None</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'DM')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">DM</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'HTN')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">HTN</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'IHD')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">IHD</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'Asthma')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Asthma</button>
                                <button type="button" onclick="addSuggestion('p-pmh', 'CKD')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">CKD</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Past Surgical History (PSH)</label>
                            <textarea id="p-psh" rows="2" class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none" placeholder="Previous surgeries, dates..."></textarea>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" onclick="addSuggestion('p-psh', 'None')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">None</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'Appendectomy')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Appendectomy</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'Cholecystectomy')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">Cholecystectomy</button>
                                <button type="button" onclick="addSuggestion('p-psh', 'C-Section')" class="text-[10px] font-medium bg-slate-200 text-slate-700 px-2 py-1 rounded-full hover:bg-slate-300 transition-colors">C-Section</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Clinical Examination (O/E)</label>
                            <textarea id="p-exam" rows="3" class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none" placeholder="Vitals, systemic examination findings..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Management Plan & Notes *</label>
                            <textarea id="p-plan" required rows="3" class="w-full text-sm p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none" placeholder="Labs requested, imaging, current meds, next steps..."></textarea>
                        </div>
                    </div>
                    
                    <div class="pt-4 pb-8 md:pb-2">
                        <button type="button" onclick="submitPatient()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg shadow-md transition-all flex items-center justify-center gap-2 text-base">
                            <i class="fa-solid fa-floppy-disk"></i> Save & Handover
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- Right Column: Patient List / Dashboard -->
        <section class="flex-1 flex flex-col bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden h-full">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                <h2 class="font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list text-blue-600"></i> Active Patients
                </h2>
                <div class="flex items-center gap-2">
                    <div class="text-xs font-medium text-slate-500 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm" id="patient-count">
                        0 Patients
                    </div>
                    <button onclick="exportToCSV()" title="Export to Excel (CSV)" class="text-slate-500 hover:text-green-600 bg-white border border-slate-200 px-2.5 py-1 rounded-md shadow-sm transition-colors text-sm">
                        <i class="fa-solid fa-file-excel"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar bg-slate-50/50" id="patients-container">
                <!-- Loading State -->
                <div id="loading-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                    <p class="text-sm">Loading handover data...</p>
                </div>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="bg-white p-4 rounded-full shadow-sm border border-slate-100 mb-4">
                        <i class="fa-solid fa-clipboard-check text-4xl text-green-500"></i>
                    </div>
                    <h3 class="text-lg font-medium text-slate-600 mb-1">Ward is Empty</h3>
                    <p class="text-sm">No active patients. Add a patient to start the handover.</p>
                </div>

                <!-- Cards Grid -->
                <div id="cards-grid" class="hidden grid grid-cols-1 xl:grid-cols-2 gap-4 pb-4">
                    <!-- Cards injected here via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Firebase Configuration and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables Environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'medsync-handover-default';
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        let firebaseConfig;
        
        try {
            firebaseConfig = JSON.parse(rawConfig);
            // --- YOUR FIREBASE CONFIG GOES HERE ---
            // If you host this externally, replace this block with your Firebase config
            // to enable real-time syncing between devices!
            if(Object.keys(firebaseConfig).length === 0) {
                firebaseConfig = {
                    apiKey: "mock-key",
                    projectId: "mock-project",
                };
            }
        } catch (e) {
            console.error("Config parse error", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isLocalMode = false;
        let patientsList = [];
        let unsubscribeSnapshot = null;

        // UI Elements
        const authStatusEl = document.getElementById('auth-status');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        const cardsGrid = document.getElementById('cards-grid');
        const patientCountEl = document.getElementById('patient-count');
        const submitBtn = document.getElementById('submit-btn');
        const formContainer = document.getElementById('form-container');

        // Color mapping for wards
        const wardColors = {
            'ER': 'bg-red-100 text-red-700 border-red-200',
            'ICU': 'bg-orange-100 text-orange-700 border-orange-200',
            'Internal Medicine': 'bg-green-100 text-green-700 border-green-200',
            'Surgery': 'bg-blue-100 text-blue-700 border-blue-200',
            'Pediatrics': 'bg-purple-100 text-purple-700 border-purple-200',
            'OB/GYN': 'bg-pink-100 text-pink-700 border-pink-200',
            'Other': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        // Auth Initialization
        async function initAuth() {
            try {
                if (firebaseConfig.apiKey === "mock-key") {
                    throw new Error("Missing real Firebase config. Using local fallback.");
                }
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.warn("Authentication bypassed. Switching to Local Mode:", error);
                isLocalMode = true;
                currentUser = { uid: 'local-user' }; // Fake user for local mode
                authStatusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-500"></i> Local Mode (No Sync)`;
                showToast("Running locally. Add Firebase config to sync between devices.", "warning");
                loadPatients(); // Trigger local load
            }
        }

        // Listen to Auth State
        onAuthStateChanged(auth, (user) => {
            if (isLocalMode) return; // Skip if we already fell back to local mode
            if (user) {
                currentUser = user;
                authStatusEl.innerHTML = `<i class="fa-solid fa-user-doctor text-blue-500"></i> Ready (ID: ${user.uid.substring(0, 5)}...)`;
                loadPatients();
            } else {
                currentUser = null;
                authStatusEl.innerHTML = `<i class="fa-solid fa-link-slash text-red-500"></i> Disconnected`;
                if(unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        // Initialize App
        initAuth();

        // Data Fetching and Listener
        function loadPatients() {
            if (!currentUser) return;

            if (isLocalMode) {
                const stored = localStorage.getItem('shiftSyncPatients');
                patientsList = stored ? JSON.parse(stored) : [];
                patientsList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPatients();
                return;
            }

            // RULE 1: Strict Paths enforced here (Public Shared Data)
            const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');

            // RULE 2: No Complex Queries. Fetch all, process locally.
            unsubscribeSnapshot = onSnapshot(patientsRef, (snapshot) => {
                patientsList = [];
                snapshot.forEach((doc) => {
                    patientsList.push({ id: doc.id, ...doc.data() });
                });

                // Local Sort: Newest first
                patientsList.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeB - timeA;
                });

                renderPatients();
            }, (error) => {
                console.error("Firestore Listener Error:", error);
                showToast("Failed to sync patients.", "error");
            });
        }

        // Render Cards UI
        function renderPatients() {
            loadingState.classList.add('hidden');
            
            patientCountEl.textContent = `${patientsList.length} Patient${patientsList.length !== 1 ? 's' : ''}`;

            if (patientsList.length === 0) {
                emptyState.classList.remove('hidden');
                cardsGrid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                
                cardsGrid.innerHTML = '';
                
                patientsList.forEach(patient => {
                    const wardClass = wardColors[patient.ward] || wardColors['Other'];
                    const genderIcon = patient.gender === 'Male' ? '<i class="fa-solid fa-mars text-blue-400"></i>' : 
                                     (patient.gender === 'Female' ? '<i class="fa-solid fa-venus text-pink-400"></i>' : '');

                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col hover:shadow-md transition-shadow duration-200";
                    
                    card.innerHTML = `
                        <div class="p-4 border-b border-slate-100 flex justify-between items-start gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-bold text-slate-800 text-lg leading-none">${escapeHTML(patient.name)}</h3>
                                    ${genderIcon}
                                </div>
                                <div class="text-sm text-slate-500 font-medium">
                                    ${patient.age} y/o • <span class="px-2 py-0.5 rounded text-xs border font-semibold ${wardClass}">${escapeHTML(patient.ward)}</span>
                                </div>
                            </div>
                            <button onclick="window.removePatient('${patient.id}')" title="Discharge / Remove" class="text-slate-300 hover:text-red-500 transition-colors p-1">
                                <i class="fa-solid fa-sign-out-alt text-lg"></i>
                            </button>
                        </div>
                        
                        <div class="p-4 flex-1 space-y-4 text-sm">
                            <div>
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-orange-400"></i> Chief Complaint</h4>
                                <p class="text-slate-800 font-medium bg-slate-50 p-2 rounded border border-slate-100">${escapeHTML(patient.cc)}</p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5"><i class="fa-solid fa-clock-rotate-left"></i> PMH</h4>
                                    <p class="text-slate-600 line-clamp-3">${escapeHTML(patient.pmh) || '<span class="text-slate-300 italic">None</span>'}</p>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5"><i class="fa-solid fa-scalpel"></i> PSH</h4>
                                    <p class="text-slate-600 line-clamp-3">${escapeHTML(patient.psh) || '<span class="text-slate-300 italic">None</span>'}</p>
                                </div>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5"><i class="fa-solid fa-stethoscope"></i> Examination (O/E)</h4>
                                <p class="text-slate-700 bg-slate-50 p-2 rounded">${escapeHTML(patient.exam) || '<span class="text-slate-400 italic">No examination details</span>'}</p>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5"><i class="fa-solid fa-clipboard-list text-blue-500"></i> Plan & Notes</h4>
                                <p class="text-slate-800 bg-blue-50/50 p-2 rounded border border-blue-100 font-medium whitespace-pre-wrap">${escapeHTML(patient.plan)}</p>
                            </div>
                        </div>
                    `;
                    cardsGrid.appendChild(card);
                });
            }
        }

        // Global functions for inline HTML event handlers
        window.submitPatient = async function() {
            if (!currentUser) {
                showToast("Not authenticated.", "error");
                return;
            }

            // Validations
            const name = document.getElementById('p-name').value.trim();
            const age = document.getElementById('p-age').value;
            const gender = document.getElementById('p-gender').value;
            const ward = document.getElementById('p-ward').value;
            const cc = document.getElementById('p-cc').value.trim();
            const pmh = document.getElementById('p-pmh').value.trim();
            const psh = document.getElementById('p-psh').value.trim();
            const exam = document.getElementById('p-exam').value.trim();
            const plan = document.getElementById('p-plan').value.trim();

            if (!name || !age || !gender || !ward || !cc || !plan) {
                showToast("Please fill in all required fields (*)", "warning");
                return;
            }

            const patientData = {
                name,
                age: Number(age),
                gender,
                ward,
                cc,
                pmh,
                psh,
                exam,
                plan,
                addedBy: currentUser.uid,
                createdAt: isLocalMode ? Date.now() : serverTimestamp()
            };

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...`;
            submitBtn.disabled = true;

            try {
                if (isLocalMode) {
                    const newPatient = { ...patientData, id: 'local_' + Date.now() };
                    patientsList.push(newPatient);
                    localStorage.setItem('shiftSyncPatients', JSON.stringify(patientsList));
                    loadPatients();
                } else {
                    const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');
                    await addDoc(patientsRef, patientData);
                }
                
                showToast("Patient added to handover list.", "success");
                document.getElementById('patient-form').reset();
                
                // Hide form on mobile after submission
                if(window.innerWidth < 768) {
                    formContainer.classList.add('hidden');
                    formContainer.classList.remove('flex');
                }
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("Failed to add patient.", "error");
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        };

        window.removePatient = async function(docId) {
            if (!currentUser) return;
            
            // Custom confirmation (no alert/confirm allowed per rules)
            // Creating a simple modal inline
            const confirmDelete = confirmModal("Discharge Patient", "Are you sure you want to remove this patient from the active list?", async () => {
                try {
                    if (isLocalMode) {
                        patientsList = patientsList.filter(p => p.id !== docId);
                        localStorage.setItem('shiftSyncPatients', JSON.stringify(patientsList));
                        loadPatients();
                    } else {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'patients', docId);
                        await deleteDoc(docRef);
                    }
                    showToast("Patient removed successfully.", "success");
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    showToast("Failed to remove patient.", "error");
                }
            });
        };

        window.toggleForm = function() {
            if (formContainer.classList.contains('hidden')) {
                formContainer.classList.remove('hidden');
                formContainer.classList.add('flex');
            } else {
                formContainer.classList.add('hidden');
                formContainer.classList.remove('flex');
            }
        };

        window.exportToCSV = function() {
            if (patientsList.length === 0) {
                showToast("No patients to export.", "warning");
                return;
            }

            const headers = ['Name', 'Age', 'Gender', 'Ward', 'Chief Complaint', 'PMH', 'PSH', 'Examination', 'Plan'];
            
            const escapeCSV = (str) => {
                if (str === null || str === undefined) return '""';
                // Escape quotes and wrap in quotes to handle commas and multiline text in Excel
                return `"${String(str).replace(/"/g, '""')}"`;
            };

            const rows = patientsList.map(p => [
                escapeCSV(p.name),
                escapeCSV(p.age),
                escapeCSV(p.gender),
                escapeCSV(p.ward),
                escapeCSV(p.cc),
                escapeCSV(p.pmh),
                escapeCSV(p.psh),
                escapeCSV(p.exam),
                escapeCSV(p.plan)
            ].join(','));

            const csvContent = [headers.join(','), ...rows].join('\n');
            
            // Added UTF-8 BOM so MS Excel reads Arabic/special characters correctly
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `ShiftSync_Handover_${new Date().toISOString().split('T')[0]}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("Exported to Excel successfully!", "success");
        };

        window.addSuggestion = function(fieldId, text) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            
            // If selecting "None", clear everything else and just put "None"
            if (text === 'None') {
                field.value = 'None';
                field.focus();
                return;
            }

            // Append logic for other suggestions
            let currentValue = field.value.trim();
            if (currentValue === '' || currentValue === 'None') {
                field.value = text;
            } else {
                if (currentValue.endsWith(',')) {
                    field.value = currentValue + ' ' + text;
                } else {
                    field.value = currentValue + ', ' + text;
                }
            }
            field.focus();
        };

        // Utility: Escape HTML to prevent XSS
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = '';
            let colors = '';
            
            if (type === 'success') {
                icon = '<i class="fa-solid fa-circle-check text-green-500"></i>';
                colors = 'bg-white border-green-200 text-slate-700';
            } else if (type === 'error') {
                icon = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
                colors = 'bg-white border-red-200 text-slate-700';
            } else {
                icon = '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>';
                colors = 'bg-white border-amber-200 text-slate-700';
            }

            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-lg border shadow-lg ${colors} min-w-[250px]`;
            toast.innerHTML = `
                ${icon}
                <span class="text-sm font-medium flex-1">${message}</span>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if(container.contains(toast)) {
                    toast.classList.replace('toast-enter', 'toast-leave');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // Custom Confirm Modal
        function confirmModal(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center backdrop-blur-sm px-4";
            
            const modal = document.createElement('div');
            modal.className = "bg-white rounded-xl shadow-xl max-w-sm w-full p-6 animate-[slideIn_0.2s_ease-out]";
            
            modal.innerHTML = `
                <h3 class="text-lg font-bold text-slate-800 mb-2">${title}</h3>
                <p class="text-sm text-slate-600 mb-6">${message}</p>
                <div class="flex justify-end gap-3">
                    <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                    <button id="modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:bg-red-600 rounded-lg transition-colors">Discharge</button>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            document.getElementById('modal-cancel').onclick = () => {
                document.body.removeChild(overlay);
            };

            document.getElementById('modal-confirm').onclick = () => {
                document.body.removeChild(overlay);
                onConfirm();
            };
        }

    </script>
</body>
